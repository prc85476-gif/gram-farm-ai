<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Facet Gradients for 3D Diamond / Gram Coin -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Shimmer Highlight -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Base -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4" />
  
  <!-- Subtle Internal Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- 3D Polyhedral GRAM Token Facets -->
  <!-- Top Pyramid Peak -->
  <polygon points="100,32 154,68 100,96" fill="url(#facetTop)" opacity="0.95" />
  <polygon points="100,32 46,68 100,96" fill="url(#facetLeft)" />
  
  <!-- Bottom Crystal Inverted Base -->
  <polygon points="46,68 100,96 100,168" fill="url(#facetBottom)" />
  <polygon points="154,68 100,96 100,168" fill="url(#facetRight)" />
  
  <!-- Outer Wings Edge Depth -->
  <polygon points="100,32 154,68 100,168" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="100,32 46,68 100,168" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Center Center Light Reflection Line -->
  <line x1="100" y1="32" x2="100" y2="168" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="46" y1="68" x2="154" y2="68" stroke="#E0E7FF" stroke-width="1.8" opacity="0.75" />

  <!-- Crisp 'GRAM' Text Emblem Overlay or Stylized Letter G -->
  <circle cx="100" cy="96" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
  <path d="M107 90 H95 C92 90 90 92 90 96 C90 100 92 102 96 102 H104 V97 H98" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

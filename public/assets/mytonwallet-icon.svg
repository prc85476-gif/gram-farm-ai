<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" rx="24" fill="#000000" />
  <!-- Concentric circle gear pattern -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#2563EB" stroke-width="2.5" />
  <circle cx="50" cy="50" r="24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="50" cy="50" r="16" fill="none" stroke="#60A5FA" stroke-width="2" />
  <circle cx="50" cy="50" r="8" fill="#38BDF8" />
  <!-- Radial dots -->
  <circle cx="50" cy="22" r="2.5" fill="#38BDF8" />
  <circle cx="50" cy="78" r="2.5" fill="#38BDF8" />
  <circle cx="22" cy="50" r="2.5" fill="#38BDF8" />
  <circle cx="78" cy="50" r="2.5" fill="#38BDF8" />
  <circle cx="30" cy="30" r="2" fill="#60A5FA" />
  <circle cx="70" cy="30" r="2" fill="#60A5FA" />
  <circle cx="30" cy="70" r="2" fill="#60A5FA" />
  <circle cx="70" cy="70" r="2" fill="#60A5FA" />
</svg>
